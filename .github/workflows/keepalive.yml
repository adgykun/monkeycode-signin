name: Keepalive

on:
  schedule:
    # 每月 1 日、15 日 00:00 UTC（北京时间 08:00）各产生一次真实提交，避免定时任务因 60 天无活动被禁用
    - cron: "0 0 1 * *"
    - cron: "0 0 15 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update keepalive timestamp
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: keepalive $(date -u +%Y-%m)"
            git push
          fi
