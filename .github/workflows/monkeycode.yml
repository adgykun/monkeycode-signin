name: 🐒 MonkeyCode Daily

on:
  schedule:
    # Beijing 07:23 = UTC 23:23 on the previous day.
    - cron: "23 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monkeycode-daily
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      MONKEYCODE_CN_TOKENS: ${{ secrets.MONKEYCODE_CN_TOKENS }}
      MONKEYCODE_CN_TOKEN: ${{ secrets.MONKEYCODE_CN_TOKEN }}
      MONKEYCODE_INTL_TOKENS: ${{ secrets.MONKEYCODE_INTL_TOKENS }}
      MONKEYCODE_INTL_TOKEN: ${{ secrets.MONKEYCODE_INTL_TOKEN }}
      MONKEYCODE_NOTIFY: ${{ secrets.MONKEYCODE_NOTIFY }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      BARK_URL: ${{ secrets.BARK_URL }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
      WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Offline tests
        run: python -m unittest discover -s tests -v

      - name: Detect account configuration
        id: config
        run: |
          if [ -n "$MONKEYCODE_CN_TOKENS$MONKEYCODE_CN_TOKEN$MONKEYCODE_INTL_TOKENS$MONKEYCODE_INTL_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run check-in
        if: steps.config.outputs.configured == 'true'
        run: python monkeycode_daily.py

      - name: No account configured
        if: steps.config.outputs.configured != 'true'
        run: echo "::warning::未配置 MonkeyCode 账号 Secrets，跳过签到。"
